<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anison Café Menu</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Icons -->
    <div class="floating-icons">
        <div class="icon-float"><i class="fas fa-mug-hot"></i></div>
        <div class="icon-float"><i class="fas fa-coffee"></i></div>
        <div class="icon-float"><i class="fas fa-glass-citrus"></i></div>
        <div class="icon-float"><i class="fas fa-ice-cream"></i></div>
        <div class="icon-float"><i class="fas fa-leaf"></i></div>
        <div class="icon-float"><i class="fas fa-croissant"></i></div>
    </div>

    <!-- Header -->
    <header class="header">
        <h1><img src="Logo.png" alt="Anison Café Logo"></h1>
        <div class="menu-title">MENU</div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar and Products Wrapper -->
        <div class="sidebar-products-wrapper">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <!-- Search -->
                <div class="search-box">
                    <input type="text" id="search" placeholder="ابحث...">
                </div>

                <!-- Categories -->
                <nav class="categories-nav" id="categories-nav"></nav>
            </aside>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-address">
                <strong>Anison Café</strong><br>
                TAQA الفيوم - ميدان عبدالمنعم رياض داخل بنزينة
            </div>

            <div class="footer-hours">
                مفتوح 24/7 - Open 24/7
            </div>

            <div class="social-links">
                <a href="https://wa.me/201234567890" target="_blank" class="social-link" title="WhatsApp"
                    aria-label="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="https://instagram.com/anison.cafe" target="_blank" class="social-link" title="Instagram"
                    aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://facebook.com/anison.cafe" target="_blank" class="social-link" title="Facebook"
                    aria-label="Facebook">
                    <i class="fab fa-facebook"></i>
                </a>
                <a href="https://tiktok.com/@anison.cafe" target="_blank" class="social-link" title="TikTok"
                    aria-label="TikTok">
                    <i class="fab fa-tiktok"></i>
                </a>
            </div>

            <div class="footer-copyright">
                © Abdelrahman Ali. جميع الحقوق محفوظة
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
